{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Фестивали{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header mb-4">
        <div class="container d-flex align-items-center gap-3">
            <a href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="Фестивали"
                    class="site-logo"
                >
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container pb-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer container mt-4 mb-3">
        <p>
            © <span id="current-year"></span>
            Регистрация участников фестиваля
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
