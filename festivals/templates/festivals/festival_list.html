{% extends "base.html" %}

{% block title %}Фестивали{% endblock %}

{% block content %}
    <h1 class="mb-3">Фестивали</h1>
    <p class="text-muted">Всего фестивалей: {{ items|length }}</p>

    {% for item in items %}
        {% include "festivals/includes/festival_card.html" %}
    {% empty %}
        <p>Фестивали не найдены.</p>
    {% endfor %}
{% endblock %}
